name: CI
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: ecohaul_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d ecohaul_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DB_PORT: '5432'
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install poetry==2.5.2
      - run: poetry install --no-root --no-interaction
      - run: poetry run python -m compileall -q app
      - run: poetry run flake8 app tests scripts/outbox.py --select=E9,F63,F7,F82
      - run: poetry run pytest --integration -q
      - name: Fresh database migrations
        env:
          PGPASSWORD: postgres
          DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/ecohaul_migration_test
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -c 'CREATE DATABASE ecohaul_migration_test'
          poetry run alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  production-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile.backend -t ecohaul-backend:ci .
      - run: docker run --rm ecohaul-backend:ci python -c "from app.main import app; print(app.title)"
