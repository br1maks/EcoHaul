[tool.poetry]
name = "ecohaul-backend"
version = "0.1.0"
description = "EcoHaul - Telegram Mini App для вывоза мусора из Минска"
authors = ["Maksim <brinkevich06@gmail.com>"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
sqlalchemy = "^2.0.23"
alembic = "^1.12.1"
pydantic = "^2.4.2"
pydantic-settings = "^2.1.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
celery = "^5.3.4"
redis = "^5.0.1"
aiofiles = "^23.2.1"
aiogram = "^3.1.1"
python-dotenv = "^1.0.0"
geoalchemy2 = "^0.14.2"
geojson = "^3.1.0"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
python-multipart = "^0.0.6"
email-validator = "^2.1.0"
yookassa = "^3.8.0"
aiosmtplib = "^5.0.0"
websockets = "^15.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
ipython = "^8.16.1"
black = "^23.11.0"
mypy = "^1.7.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
httpx = "^0.25.2"
websockets = "^15.0.1"

[tool.poetry.scripts]
app = "app.main:app"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
env = ["DEBUG=True"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
